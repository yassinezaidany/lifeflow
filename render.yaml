# Render Blueprint — free public deployment of LifeFlow.
# Render builds the Dockerfile and runs Gunicorn behind HTTPS (*.onrender.com).
# The MySQL database is external (free Aiven MySQL); see docs/20-PUBLISH-FREE.md.
# Values marked `sync: false` are asked for when the Blueprint is created (never committed).
services:
  - type: web
    name: lifeflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_TOKEN
        generateValue: true
      - key: USE_HTTPS
        value: "True"
      - key: MEDIA_STORAGE
        value: db
      - key: GUNICORN_WORKERS
        value: "2"
      - key: DEFAULT_TIMEZONE
        value: Africa/Casablanca
      # --- MySQL (Aiven "Connection information") ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: REQUIRED
      # --- First administrator (created at start-up if missing) ---
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # --- Optional: Web Push (python manage.py generate_vapid_keys) ---
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # --- Optional: e-mails through Brevo's API (SMTP is blocked on free plans) ---
      - key: EMAIL_BACKEND
        value: apps.core.mail.BrevoEmailBackend
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # --- Optional: Claude for the challenge assistant ---
      - key: ANTHROPIC_API_KEY
        sync: false
