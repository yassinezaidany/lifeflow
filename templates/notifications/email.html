{% load i18n %}<!doctype html>
<html><body style="margin:0;background:#F7F7F8;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#18181B">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px"><tr><td align="center">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #E4E4E7;border-radius:16px">
    <tr><td style="padding:24px 28px 0;font-weight:600;font-size:15px"><span style="color:#4F46E5">●</span> LifeFlow</td></tr>
    <tr><td style="padding:16px 28px 0;font-size:20px;font-weight:600">{{ notification.title }}</td></tr>
    {% if notification.body %}<tr><td style="padding:8px 28px 0;font-size:14px;line-height:1.6;color:#52525B">{{ notification.body }}</td></tr>{% endif %}
    <tr><td style="padding:24px 28px">
      <a href="{{ link }}" style="display:inline-block;background:#4F46E5;color:#ffffff;text-decoration:none;font-weight:600;font-size:14px;padding:10px 18px;border-radius:10px">{% trans "Open LifeFlow" %}</a>
    </td></tr>
    <tr><td style="padding:0 28px 24px;font-size:12px;color:#A1A1AA">{% trans "You receive this e-mail because e-mail notifications are enabled in your LifeFlow settings." %}</td></tr>
  </table>
</td></tr></table>
</body></html>
