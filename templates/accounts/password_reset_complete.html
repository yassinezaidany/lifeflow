{% extends "layouts/auth.html" %}
{% load i18n ui %}
{% block title %}{% trans "Password updated" %}{% endblock %}
{% block content %}
<div class="tone-emerald mb-6 flex h-12 w-12 items-center justify-center rounded-2xl bg-tone/10 text-tone-strong">{% icon "shield-check" "icon-lg" %}</div>
<h1 class="text-2xl font-semibold">{% trans "Password updated" %}</h1>
<p class="mt-2 text-sm text-muted">{% trans "You can now sign in with your new password." %}</p>
<a href="{% url 'accounts:login' %}" class="btn btn-primary mt-8 w-full">{% trans "Sign in" %}</a>
{% endblock %}
