{% if user.profile.avatar %}<img src="{{ user.profile.avatar.url }}" alt="" class="{{ size|default:'h-8 w-8' }} rounded-full object-cover">{% else %}<span class="tone-indigo {{ size|default:'h-8 w-8 text-xs' }} inline-flex shrink-0 items-center justify-center rounded-full bg-tone/15 font-semibold text-tone-strong" aria-hidden="true">{{ user.initials }}</span>{% endif %}
